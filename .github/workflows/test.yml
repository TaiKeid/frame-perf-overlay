name: Linux tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Optional source commit for a matched baseline build
        type: string

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build libcairo2-dev libfreetype-dev libvulkan-dev libnl-genl-3-dev fonts-noto-cjk
          mkdir -p "$RUNNER_TEMP/openvr"
          case "$(uname -m)" in
            aarch64) sdk_arch=linuxarm64 ;;
            x86_64) sdk_arch=linux64 ;;
            *) exit 1 ;;
          esac
          curl --fail --location --retry 3 "https://raw.githubusercontent.com/ValveSoftware/openvr/0924064316de3effbcd1acf1e309182a2deb1c05/lib/$sdk_arch/libopenvr_api.so" -o "$RUNNER_TEMP/openvr/libopenvr_api.so"
          c++ --version
          sha256sum "$RUNNER_TEMP/openvr/libopenvr_api.so"
      - name: Build and test
        run: |
          cmake -G Ninja -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DOPENVR_LIB_DIR="$RUNNER_TEMP/openvr"
          cmake --build build --parallel 4
          ctest --test-dir build --output-on-failure
          sh vendor/frame-updater/verify.sh --local-only
      - name: Record validation build
        env:
          LD_LIBRARY_PATH: ${{ runner.temp }}/openvr
        run: |
          mkdir -p ci-results
          cp build/frame-perf-overlay ci-results/panel-unstripped
          cp build/frame-perf-overlay ci-results/frame-perf-overlay
          strip ci-results/frame-perf-overlay
          stat -c '%n %s' ci-results/* | tee ci-results/sizes.txt
          sha256sum ci-results/frame-perf-overlay | tee ci-results/SHA256SUMS
          readelf -d ci-results/frame-perf-overlay >ci-results/dependencies.txt
          c++ --version >ci-results/compiler.txt
          git rev-parse HEAD >ci-results/source-commit.txt
          ./build/frame-perf-overlay --version
          ./build/frame-perf-overlay --dump-settings-png ci-results/settings-en.png --config "$RUNNER_TEMP/test-config.json" --language en
          ./build/frame-perf-overlay --dump-settings-png ci-results/settings-ja.png --config "$RUNNER_TEMP/test-config.json" --language ja
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.runner }}
          path: |
            ci-results/
            build/Testing/Temporary/LastTest.log
          retention-days: 14
